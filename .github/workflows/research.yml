name: Seiko research — guarded automatic analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/auto_research.py'
      - 'research/market_context.py'
      - 'research/whale_watch.py'
      - 'research/whale_watchlist.json'
      - 'tests/test_market_intelligence.py'
      - 'research/ai_reflection.py'
      - 'research/large_transfers.py'
      - 'research/market_pulse.py'
      - 'tests/test_autonomous_market.py'
      - 'research/ai_decision_support.py'
      - 'tests/test_ai_decision_support.py'
      - 'tests/test_research_automation.py'
      - '.github/workflows/research.yml'
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: seiko-trading-lab-serialized
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify research safety gates
        run: |
          python -m py_compile research/auto_research.py research/ai_reflection.py research/ai_decision_support.py
          python -m unittest discover -s tests -p 'test_research_automation.py' -v
          python -m unittest discover -s tests -p 'test_ai_decision_support.py' -v
      - name: Validate independent market intelligence
        run: |
          python -m py_compile research/market_context.py research/whale_watch.py
          python -m unittest discover -s tests -p 'test_market_intelligence.py' -v
          python -m unittest discover -s tests -p 'test_autonomous_market.py' -v
      - name: Collect free research data and optional verified-wallet transfers
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          python research/market_context.py
          python research/whale_watch.py
          python research/large_transfers.py
      - name: Test historical strategies
        run: python -m unittest discover -s tests -p 'test_historical_research.py' -v && python research/walkforward.py && python research/market_pulse.py
      - name: Read live paper reports and suggest experiments
        run: python research/auto_research.py
      - name: AI research every six hours maximum — cached between reviews
        env:
          SEIKO_AI_ENABLED: ${{ vars.SEIKO_AI_ENABLED || '1' }}
          SEIKO_AI_PROVIDER: ${{ vars.SEIKO_AI_PROVIDER || 'gemini' }}
          SEIKO_AI_MODEL: ${{ vars.SEIKO_AI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m research.ai_reflection
      - name: Rebuild read-only Lab 04 after AI research
        run: |
          python -m unittest discover -s tests -p 'test_site_lab04.py' -v
          python build_site.py
          mkdir -p docs
          cp site/dashboard.html docs/index.html
      - name: Publish research observations (no robot changes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/autonomous_research.json reports/autonomous_research.md reports/autonomous_research_history.jsonl
          git add reports/ai_research.md reports/ai_research_status.json reports/ai_research_proposals.json reports/challenger_walkforward.json reports/challenger_candles.json
          git add reports/market_context.json reports/whale_observations.json reports/large_transfer_observations.json reports/market_pulse.json
          git add site/dashboard.html docs/index.html
          git add -A state/whale_watch_state.json state/large_transfer_cursor.json reports/whale_transfer_events.jsonl 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update guarded Seiko research observations"
            for attempt in 1 2 3 4 5; do
              if git push; then
                exit 0
              fi
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; echo "::warning::Concurrent Git publication; this report cycle was skipped safely. The next scheduled run will retry."; exit 0; }
              sleep 3
            done
            exit 1
          fi
