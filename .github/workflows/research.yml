name: Seiko research — guarded automatic analysis

on:
  workflow_dispatch:
  # A scoped code change boots research without waiting for GitHub's best-effort cron.
  # Report/state commits from the research and paper jobs never retrigger this job.
  push:
    branches: [main]
    paths:
      - '.github/workflows/research.yml'
      - 'research/research_dispatch_guard.py'
      - 'research/autonomous_optimizer.py'
      - 'research/strategy_evolution.py'
      - 'research/strategy_competition.py'
      - 'research/strategy_foundry.py'
      - 'research/strategy_forward.py'
      - 'research/market_knowledge.py'
      - 'research/manual_live_review.py'
      - 'research/ai_reflection.py'
      - 'research/ai_decision_support.py'
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: seiko-trading-lab-serialized
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify research safety gates
        run: |
          python -m py_compile research/auto_research.py research/ai_reflection.py research/ai_decision_support.py research/robot_evolution.py research/robot_tuning.py research/robot_shadow.py
          python -m unittest discover -s tests -p 'test_robot_evolution.py' -v
          python -m unittest discover -s tests -p 'test_research_automation.py' -v
          python -m unittest discover -s tests -p 'test_ai_decision_support.py' -v
          python -m unittest discover -s tests -p 'test_ai_notebook.py' -v
          python -m unittest discover -s tests -p 'test_daily_brief.py' -v
          python -m unittest discover -s tests -p 'test_intraday_lab.py' -v
          python -m unittest discover -s tests -p 'test_ops_status.py' -v
          python -m unittest discover -s tests -p 'test_ait_upgrade.py' -v
          python -m unittest discover -s tests -p 'test_research_dispatch_guard.py' -v
          python -m unittest discover -s tests -p 'test_strategy_foundry.py' -v
          python -m unittest discover -s tests -p 'test_market_knowledge.py' -v
          python -m unittest discover -s tests -p 'test_strategy_forward.py' -v
          python -m unittest discover -s tests -p 'test_autonomous_optimizer.py' -v
          python -m unittest discover -s tests -p 'test_manual_live_review.py' -v
          python -m unittest discover -s tests -p 'test_strategy_evolution.py' -v
          python -m unittest discover -s tests -p 'test_strategy_competition.py' -v
      - name: Validate independent market intelligence
        run: |
          python -m py_compile research/market_context.py research/whale_watch.py
          python -m unittest discover -s tests -p 'test_market_intelligence.py' -v
          python -m unittest discover -s tests -p 'test_autonomous_market.py' -v
          python -m unittest discover -s tests -p 'test_base_usdc_watch.py' -v
          node --check site/lab04-clarity.js
      - name: Collect free research data and optional verified-wallet transfers
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          python research/market_context.py
          python research/whale_watch.py
          python research/large_transfers.py
          python -m research.base_usdc_watch
          python -m research.whale_follow
          python -m research.news_watch
      - name: Test historical strategies
        run: python -m unittest discover -s tests -p 'test_historical_research.py' -v && python research/walkforward.py && python research/market_pulse.py
      - name: Test and update frozen forward-only challenger incubator
        run: |
          python -m unittest discover -s tests -p 'test_challenger_incubator.py' -v
          python -m research.challenger_incubator
      - name: Run source-qualified hourly market studies and prospective paper followers
        run: python -m research.intraday_lab
      - name: Read live paper reports and suggest experiments
        run: python research/auto_research.py
      - name: Retain sourced point-in-time market research observations
        run: python -m research.market_knowledge
      - name: Search risk-adjusted strategy parameters with strict time separation
        run: python -m research.autonomous_optimizer
      - name: Evolve finite strategy genomes from historic failures
        run: python -m research.strategy_evolution
      - name: AI research every six hours maximum — cached between reviews
        env:
          SEIKO_AI_ENABLED: ${{ vars.SEIKO_AI_ENABLED || '1' }}
          # GPT supervision is performed inside ChatGPT, never through a billed API.
          # Lock the unattended workflow to Gemini; no OpenAI secret is exposed.
          SEIKO_AI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m research.ai_reflection
      - name: Archive and replay bounded AI-designed strategy hypotheses
        run: python -m research.strategy_foundry
      - name: Observe AI strategy candidates on new daily candles only
        run: python -m research.strategy_forward
      - name: Rank paper strategies on future evidence and revoke decayed candidates
        run: python -m research.strategy_competition
      - name: Evaluate prospectively tested candidates for HUMAN review only
        run: python -m research.manual_live_review
      - name: Review and safely promote eligible paper bot tuning candidates
        run: python -m research.robot_evolution
      - name: Run new Gemini-directed hypothetical market experiments
        run: python -m research.scenario_lab
      - name: Publish sourced news and honest Gemini patchnotes
        run: python -m research.ai_notebook
      - name: Publish dated daily research summary, separating Gemini from statistical research
        run: python -m research.daily_brief
      - name: Check recent workflow reliability and publish live capability roadmap
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m research.ops_status
      - name: Validate site independently of research data
        id: site_validation
        continue-on-error: true
        run: python -m unittest discover -s tests -p 'test_site_lab04.py' -v
      - name: Rebuild read-only Lab 04 after AI research
        if: steps.site_validation.outcome == 'success'
        run: |
          python build_site.py
          mkdir -p docs
          cp site/dashboard.html docs/index.html
          cp site/lab04-*.js site/lab04-*.css docs/
      - name: Warn if UI failed; continue publishing research reports
        if: steps.site_validation.outcome != 'success'
        run: echo "::warning::Site validation failed; keeping last published UI while saving research."
      - name: Publish research observations (no robot changes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/autonomous_research.json reports/autonomous_research.md reports/autonomous_research_history.jsonl
          git add reports/ai_research.md reports/ai_research_status.json reports/ai_research_proposals.json reports/challenger_walkforward.json reports/challenger_candles.json reports/robot_evolution.json reports/ai_placement_experiments.json reports/market_news.json reports/ai_journal.json reports/ai_daily_brief.json
          git add reports/intraday_research.json reports/system_health.json
          git add reports/market_context.json reports/whale_observations.json reports/large_transfer_observations.json reports/whale_follow.json reports/base_usdc_observations.json reports/market_pulse.json reports/challenger_incubator.json
          git add reports/strategy_foundry.json reports/strategy_foundry.md state/strategy_knowledge_base.json
          git add reports/market_knowledge.json state/market_feature_history.json
          git add reports/strategy_forward.json state/strategy_forward_positions.json
          git add reports/autonomous_optimizer.json state/autonomous_optimizer.json
          git add reports/manual_live_review.json
          git add reports/strategy_evolution.json state/strategy_evolution.json
          git add reports/strategy_competition.json state/strategy_competition.json
          git add site/dashboard.html docs/index.html
          for artifact in state/whale_watch_state.json state/whale_follow_state.json state/large_transfer_cursor.json state/challenger_incubator.json state/robot_evolution_state.json state/robot_tuning_active.json state/ai_placement_experiments.json state/ai_journal_state.json state/ai_daily_brief_state.json state/intraday_paper.json reports/robot_evolution_events.jsonl reports/challenger_incubator_history.jsonl reports/whale_transfer_events.jsonl; do
            if [ -f "$artifact" ]; then git add -- "$artifact"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update guarded Seiko research observations"
            for attempt in 1 2 3 4 5; do
              if git push; then
                exit 0
              fi
              git fetch origin main
              git -c rebase.autoStash=true rebase --autostash origin/main || { git rebase --abort || true; echo "::error::Concurrent Git publication failed; outputs not persisted. Research will retry on next trigger."; exit 1; }
              sleep 3
            done
            exit 1
          fi
