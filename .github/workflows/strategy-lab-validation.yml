name: AIT strategy lab — isolated validation

on:
  push:
    paths:
      - '.github/workflows/strategy-lab-validation.yml'
      - 'research/autonomous_optimizer.py'
      - 'research/strategy_foundry.py'
      - 'research/strategy_evolution.py'
      - 'research/strategy_architect.py'
      - 'research/scientific_memory.py'
      - 'research/research_director.py'
      - 'research/creative_review.py'
      - 'research/strategy_competition.py'
      - 'research/strategy_forward.py'
      - 'research/manual_live_review.py'
      - 'research/market_knowledge.py'
      - 'research/ai_reflection.py'
      - 'research/ai_decision_support.py'
      - 'build_site.py'
      - 'site/lab04-research.js'
      - 'tests/test_autonomous_optimizer.py'
      - 'tests/test_manual_live_review.py'
      - 'tests/test_strategy_foundry.py'
      - 'tests/test_strategy_evolution.py'
      - 'tests/test_strategy_architect.py'
      - 'tests/test_scientific_memory.py'
      - 'tests/test_research_director.py'
      - 'tests/test_strategy_competition.py'
      - 'tests/test_strategy_forward.py'
      - 'tests/test_market_knowledge.py'
      - 'tests/test_site_lab04.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ait-strategy-lab-validation
  cancel-in-progress: true

jobs:
  offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Python and dashboard syntax
        run: |
          python -m py_compile research/autonomous_optimizer.py research/strategy_evolution.py research/strategy_architect.py research/scientific_memory.py research/research_director.py research/creative_review.py research/strategy_competition.py research/strategy_foundry.py research/strategy_forward.py research/manual_live_review.py research/market_knowledge.py research/ai_reflection.py research/ai_decision_support.py build_site.py
          node --check site/lab04-research.js
      - name: Test bounded optimizer and publication gates
        run: |
          python -m unittest discover -s tests -p 'test_autonomous_optimizer.py' -v
          python -m unittest discover -s tests -p 'test_manual_live_review.py' -v
          python -m unittest discover -s tests -p 'test_strategy_foundry.py' -v
          python -m unittest discover -s tests -p 'test_strategy_forward.py' -v
          python -m unittest discover -s tests -p 'test_market_knowledge.py' -v
          python -m unittest discover -s tests -p 'test_site_lab04.py' -v
          python -m unittest discover -s tests -p 'test_strategy_evolution.py' -v
          python -m unittest discover -s tests -p 'test_strategy_architect.py' -v
          python -m unittest discover -s tests -p 'test_scientific_memory.py' -v
          python -m unittest discover -s tests -p 'test_research_director.py' -v
          python -m unittest discover -s tests -p 'test_strategy_competition.py' -v
      - name: Smoke-test research on cached market snapshots
        run: |
          python -m research.autonomous_optimizer
          python -m research.strategy_evolution
          python -m research.strategy_architect
          python -m research.research_director
          python -m research.strategy_foundry
          python -m research.strategy_forward
          python -m research.strategy_competition
          python -m research.scientific_memory
          python -m research.manual_live_review
          python build_site.py
      - name: Assert no live trading controls were introduced
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          auto=json.loads(Path('reports/autonomous_optimizer.json').read_text())
          paper=json.loads(Path('reports/strategy_forward.json').read_text())
          gate=json.loads(Path('reports/manual_live_review.json').read_text())
          assert auto['real_orders'] is False and auto['robot_changes'] is False
          assert paper['real_orders'] is False and paper['robots_modified'] is False
          assert gate['real_trading_enabled'] is False
          assert json.loads(Path('reports/strategy_evolution.json').read_text())['real_orders'] is False
          assert json.loads(Path('reports/strategy_architect.json').read_text())['real_orders'] is False
          assert json.loads(Path('reports/scientific_memory.json').read_text())['real_orders'] is False
          assert json.loads(Path('reports/research_director.json').read_text())['real_orders'] is False
          assert json.loads(Path('reports/strategy_competition.json').read_text())['real_orders'] is False
          assert gate['model_can_enable_live_trading'] is False
          print('AIT paper-only firewall verified:', auto['candidate_count'], 'hypotheses')
          PY
