name: Paper trading
on:
  push:
    branches: [main]
    paths:
      - 'multi_asset_sim.py'
      - 'tests/test_multi_asset_sim.py'
      - 'site/index.html'
      - 'site/lab04-*.js'
      - 'site/lab04-*.css'
      - 'tests/test_site_lab04.py'
      - '.github/workflows/simulate.yml'
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seiko-trading-lab-serialized
  cancel-in-progress: false
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate multi-market research catalog
        run: python -m unittest discover -s tests -p 'test_market_catalog.py' -v
      - run: python bot.py
      - name: Validate and run independent realistic paper-trading engine
        run: |
          python -m unittest discover -s tests -p 'test_realistic_*.py' -v
          python realistic_sim.py
          python analyze_realistic.py
        continue-on-error: true
      - name: Validate and run independent multi-market paper simulator
        run: |
          mkdir -p reports
          set -e -o pipefail
          {
            python -m py_compile multi_asset_sim.py analyze_multi_asset.py
            python -m unittest discover -s tests -p 'test_multi_asset*.py' -v
            python multi_asset_sim.py
            python analyze_multi_asset.py
          } 2>&1 | tee reports/multi_asset_diagnostic.log
        continue-on-error: true
      - name: Validate Lab 04 web interface
        id: site_validation
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_site_lab04.py' -v
          for f in site/lab04-*.js; do node --check "$f"; done
      - name: Warn if UI check failed
        if: steps.site_validation.outcome != 'success'
        run: echo "::warning::Site invalid; preserve last site and continue saving simulated portfolios."
      - run: python dashboard.py
      - name: Build site only when validated
        if: steps.site_validation.outcome == 'success'
        run: python build_site.py
      - name: Prepare GitHub Pages dashboard
        if: steps.site_validation.outcome == 'success'
        run: |
          mkdir -p docs
          cp site/dashboard.html docs/index.html
          cp site/lab04-*.css docs/
          cp site/lab04-*.js docs/
      - name: Save paper portfolios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ reports/ DASHBOARD.md site/dashboard.html docs/
          if ! git diff --cached --quiet; then
            git commit -m "Update simulated portfolios"
            for attempt in 1 2 3 4 5; do
              if git push; then
                exit 0
              fi
              echo "Remote updated during run; rebasing and retrying ($attempt/5)"
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; echo "::warning::Concurrent Git publication; this report cycle was skipped safely. The next scheduled run will retry."; exit 0; }
              sleep 3
            done
            echo "Could not publish after 5 attempts" >&2
            exit 1
          fi
