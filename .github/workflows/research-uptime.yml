name: AIT — independent research uptime watchdog

on:
  workflow_dispatch:
  # GitHub cron is best-effort and has missed recent scheduled events.
  # Existing ChillBot paper dispatches provide a second, event-driven heartbeat.
  workflow_run:
    workflows: ['Paper trading']
    types: [completed]
  # Keep a standalone recovery route if external paper dispatches stop.
  schedule:
    - cron: '43 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-uptime.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: ait-research-uptime
  cancel-in-progress: false

jobs:
  research-uptime:
    # A failed paper job should not automatically fan out into new research.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install watchdog dependency
        run: pip install requests
      - name: Verify stale-cycle and duplicate-dispatch protections
        run: python -m unittest discover -s tests -p 'test_research_dispatch_guard.py' -v
      - name: Recover research only if stale
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m research.research_dispatch_guard
